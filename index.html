  h+='<div class="sec">ลูกค้าประจำ</div>'+(top.length?top.map(function(c,i){return'<div class="li">'+(i+1)+'. '+esc(c.n)+' · '+rd(c.h)+' ชม. · '+c.q+' คิว</div>'}).join(""):'<div class="li">ยังไม่มีข้อมูล</div>');
  return h}
function com(){COMON=true;var U=unpaid(),h='<h3>💰 คอมมิชชั่น</h3><div class="tabs">'+["คอมมิชชั่น","ประวัติเบิก","สถิติ"].map(function(x,i){return'<button data-t="'+i+'" class="'+(CV.t===i?"on":"")+'">'+x+'</button>'}).join("")+'</div>'+(CV.t===0?tab0(U):CV.t===1?tab1():tab2())+'<div class="r"><button class="btn g" id="cx">ปิด</button></div>';
  open(h);var q=function(s){return document.querySelectorAll(s)};
  document.getElementById("cx").onclick=close;
  q(".tabs button").forEach(function(b){b.onclick=function(){CV.t=+b.dataset.t;com()}});
  q("[data-r]").forEach(function(b){b.onclick=function(){CV.r=b.dataset.r;com()}});
  q("[data-s]").forEach(function(b){b.onclick=function(){CV.s=+b.dataset.s;com()}});
  var w=document.getElementById("wd");if(w)w.onclick=function(){conf(unpaid())}}
function conf(U){COMON=false;open('<h3>ยืนยันการเบิก</h3><div class="big"><small>เบิกคอมมิชชั่น</small><b>฿'+U.amt.toLocaleString()+'</b><span>'+rd(U.h)+' คน-ชั่วโมง · '+U.q+' รายการ</span></div><div class="sub" style="margin:8px 0">ตรวจรายการที่จะเบิกก่อนกดยืนยัน</div>'+listH(U.rows)+'<div class="tot">รวม '+U.q+' รายการ = '+rd(U.h)+' ชม. = ฿'+U.amt.toLocaleString()+'</div><div class="sub">หลังกดยืนยัน คิวเหล่านี้จะถูกติดป้าย "เบิกแล้ว" และรายการทั้งหมดถูกบันทึกไว้ในประวัติเบิก</div><div class="r"><button class="btn g" id="bk">ย้อนกลับ</button><button class="btn" id="yes">ยืนยันเบิก</button></div>');
  document.getElementById("bk").onclick=function(){com()};
  document.getElementById("yes").onclick=function(){var V=unpaid(),ds=[];if(V.amt<=0){com();return}
    V.rows.forEach(function(r){if(r.d)ds.push(r.d)});
    B.forEach(function(b){if(fin(b)&&Math.abs(hrs(b)-(b.ph||0))>1e-6)b.ph=hrs(b)});
    P.A.forEach(function(a){a.paid=1});ds.sort();
    P.W.unshift({id:Date.now(),t:Date.now(),h:rd(V.h),amt:V.amt,q:V.q,f:ds[0]||"",e:ds[ds.length-1]||"",it:V.rows});
    save();grid();com()}}
document.getElementById("cm").onclick=function(){if(BOSS){com();return}
  open('<h3>รหัสเจ้านาย</h3><div class="sub">ดูคอมมิชชั่นและสถิติของร้าน</div><input id="bp" type="password" placeholder="รหัสเจ้านาย" style="margin-top:12px"><div id="er"></div><div class="r"><button class="btn g" id="cx">ยกเลิก</button><button class="btn" id="bo">เข้าดู</button></div>');
  document.getElementById("cx").onclick=close;document.getElementById("bp").focus();
  document.getElementById("bo").onclick=function(){if(document.getElementById("bp").value===BOSSPW){BOSS=true;com()}else document.getElementById("er").textContent="รหัสไม่ถูกต้อง"}};
document.getElementById("cards").addEventListener("pointerdown",function(){HOLD=true});
["pointerup","pointercancel"].forEach(function(t){document.addEventListener(t,function(){setTimeout(function(){HOLD=false},400)})});
var lastMin=-1;
setInterval(function(){cards();var m=new Date().getMinutes();if(m!==lastMin){lastMin=m;grid()}},1000);
cards();grid();
